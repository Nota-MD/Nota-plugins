# 滑杆那两条的键是清单里写下的英语原文——与 `name` / `description` 同一条规矩
# （宿主拿清单里那句原文去这张表里查，查不到就用原文）。两处用的是同一个键，
# 所以"速度窗口"这个名字在面板和设置页上是同一句话。
