<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  body {
    font-family:"Noto Sans CJK SC","Source Han Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  /* ── 两套主题：靠 body.dark / body.light 切 ── */
  body.dark  { --bg1:#0b0f16; --bg2:#151d2b; --fg:#f2f5fa; --dim:#8b97ab;
               --line:#222c3d; --card:rgba(255,255,255,.045); --accent:#2f63d8; }
  body.light { --bg1:#f7f9fc; --bg2:#eef2f8; --fg:#131922; --dim:#6b7688;
               --line:#dde4ee; --card:rgba(19,25,34,.035); --accent:#2f63d8; }

  .page {
    width:1080px; height:1350px; padding:76px 80px 64px;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    color:var(--fg); display:flex; flex-direction:column;
  }
  /* 顶部：品牌 */
  .top { display:flex; align-items:center; gap:18px; }
  .top img { width:58px; height:58px; border-radius:14px; }
  .wordmark { font-size:34px; font-weight:700; letter-spacing:.5px; }
  .date { margin-left:auto; font-size:24px; color:var(--dim); }

  /* 标题 */
  .title { margin-top:74px; font-size:52px; font-weight:700; letter-spacing:2px; }
  .subtitle { margin-top:12px; font-size:24px; color:var(--dim); letter-spacing:3px;
              text-transform:uppercase; }

  /* 核心大数字 */
  .hero { margin-top:40px; display:flex; align-items:flex-end; gap:20px; }
  .hero .num { font-size:210px; font-weight:800; line-height:.86; color:var(--accent);
               letter-spacing:-6px; }
  .hero .unit { font-size:40px; font-weight:600; color:var(--dim); padding-bottom:22px; }

  /* 波形 */
  .chart { margin-top:20px; height:340px; position:relative; }
  .chart svg { width:100%; height:100%; overflow:visible; }

  /* 三个副指标 */
  .stats { margin-top:44px; display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:22px;
          padding:28px 30px; }
  .stat .k { font-size:23px; color:var(--dim); letter-spacing:1px; }
  .stat .v { margin-top:10px; font-size:52px; font-weight:700; }
  .stat .v small { font-size:24px; font-weight:500; color:var(--dim); margin-left:6px; }

  /* 底部 */
  .foot { margin-top:auto; padding-top:30px; border-top:1px solid var(--line);
          display:flex; align-items:center; }
  .foot .tag { font-size:25px; color:var(--dim); }
  .foot .brand { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .foot .brand img { width:30px; height:30px; border-radius:8px; }
  .foot .brand span { font-size:26px; font-weight:600; letter-spacing:.5px; }
</style></head>

<script>
  // 一条"心电图"似的曲线：几处平台 + 两处尖峰。
  // 用固定序列（不用随机），两版截出来才是同一条线。
  const 速度 = [
  14,15,14,16,15,14,16,15,17,16,
  15,17,16,18,17,16,18,17,15,17,
  16,18,20,17,16,18,17,19,18,16,
  18,17,19,18,20,19,17,19,18,20,
  22,19,18,20,19,21,20,22,21,19,
  21,20,22,24,21,20,22,26,34,58,
  132,48,28,24,22,24,23,25,24,22,
  24,23,25,24,26,25,23,25,24,26,
  28,25,24,26,25,27,26,28,27,25,
  27,26,28,30,27,26,28,32,44,76,
  210,72,40,30,28,30,29,31,30,28,
  30,29,31,30,32,31,29,31,30,32,
  34,31,30,32,31,33,32,34,33,31,
  33,32,34,36,33,32,34,38,35,33];
  const W=920, H=340, PAD=8, MAX=215;
  // 幂函数压缩：平台值也能占到可观高度，曲线铺满整块，而不是贴着底走。
  const 高 = v => Math.pow(v/MAX, 0.42);
  const pts = 速度.map((v,i)=>{
    const x = i*(W/(速度.length-1));
    const y = H-PAD-高(v)*(H-PAD*2);
    return [x,y];
  });
  // 平滑：相邻点取中点做二次贝塞尔
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
    d += ` Q ${x0} ${y0} ${(x0+x1)/2} ${(y0+y1)/2}`;
  }
  const last = pts[pts.length-1];
  d += ` Q ${last[0]} ${last[1]} ${last[0]} ${last[1]}`;
  document.getElementById('line').setAttribute('d', d);
  document.getElementById('area').setAttribute('d', `${d} L ${W} ${H} L 0 ${H} Z`);
</script>
