# AI 助手插件（内置）。
#
# 走**任何 OpenAI 兼容的接口**：官方 API、中转站、以及跑在自己机器上的
# Ollama / LM Studio 都是同一条路。地址、模型、密钥由用户在面板里自己填。
#
# ⚠️ **密钥是明文存的**，在 `~/.config/nota/plugin-settings/nota.ai.toml`
# （文件 0600、目录 0700）。为什么不做加密、以及它到底挡得住谁，
# 见 `docs/12` §插件设置为什么不加密。一句话：挡的是同机器上的其他用户，
# 挡不住能读你这个账号文件的人——那本来也挡不住。
#
# 申请 `document.write` 是因为"把 AI 的回答写进文档"是这个插件的主用法。
# 但**写之前一定要让用户看见要写什么**——见 main.lua 顶部那条设计原则，
# 以及 `apply_patch` 命令的注释：回答里那段改动先画成一块 diff，
# 用户点了「应用改动」才动文档。

[plugin]
id          = "nota.ai"
name        = "AI assistant"
version     = "0.1.0"
api         = 2

description = "Writing assistant: polish, continue, summarize, translate. Bring your own API key."
license     = "BSD-2-Clause"
authors     = ["Leo Lee"]
entry       = "main.lua"

# 这个插件认哪些界面语言。一写就**参与语言协商**：应用语言在这张清单里 → 用
# `lang/<那一份>.toml`；不在 → **用英语**，并在插件栏/面板上说明「此插件不支持
# 您的语言」。细节见 `src-tauri/src/lua/api/i18n.rs` 文件头。
# ⚠️ 必须含 `en`（没命中时的兜底，缺了宿主判这份清单不合法）；清单里的语言不要求
# 有对应文件（没有就是"这个语言下全是原文"）。不写 `langs` 就不协商。
langs = ["zh-CN", "en"]

capabilities = [
  "document.read",   # 把正文送给模型当上下文
  "document.write",  # 用户确认后把结果写回文档
  "network.http",    # 请求 {base_url}/chat/completions；只发给用户填的那个地址
  "settings.own",    # 存 api_key / base_url / model / 可读范围的上限（只这一个插件自己的文件）
  "data.own",        # 2026-10-04 起：对话落盘（`~/.local/share/nota/plugin-data/nota.ai/chats.txt`）
  "fs.read",         # 2026-10-04 起：「AI 可读的文件」那一栏要能列/读工作区里的 .md
  "ui.notify",       # 生成好了、写完了、失败了都要说一声
  "ui.panel",        # 右侧那块面板：对话标签页、消息、待应用的改动、输入卡片
  "ui.menu",         # 「插件」菜单里那五个预设 ＋「新对话」
]

# ── 请宿主画的那几格设置（2026-10-10 加）────────────────────────────────
#
# 用户原话：「**API等设置专门放一个窗口**」。
#
# 在那之前这五格是**插件自己在面板里画的**（最下面五行现状 ＋ 五颗带 prompt 的
# 按钮）：地址、模型、密钥、可读上限、"边生成边显示"。问题是① 它们常驻在聊天的
# 一栏里、占掉半屏；② 用户得先学会"这个插件把设置藏在自己面板底下"。
# 现在由宿主画在「设置 → 拓展」那一页上——那本来就是**这扇窗里属于插件的地方**。
#
# ⚠️ 声明 `[[settings]]` 必须同时申请 `settings.own`（上面能力表里有）：
# 宿主写的就是 `plugin-settings/nota.ai.toml` 那份文件，没申请却从旁边写
# 等于绕过能力表开一个口子（判据在 `plugin/settings_decl.rs::check_settings`）。
#
# ⚠️ 键名与插件里那五个常量**逐字相同**（`util.lua` 的 `KEY_*`）——
# 它们是同一份文件上同一批键，两个写者（从前的插件、现在的宿主）读的必须是同一格。
# ⚠️ `label` / `help` / `placeholder` 写**英语原文**，译文进 `lang/zh-CN.toml`
# （键就是原文），规矩见 `docs/11`「给拓展做一格设置」。

[[settings]]
key         = "base_url"
kind        = "text"
label       = "Endpoint URL"
help        = "An OpenAI-compatible URL including /v1. For a local service, http://127.0.0.1:11434/v1 works."
placeholder = "https://api.openai.com/v1"

[[settings]]
key         = "model"
kind        = "text"
label       = "Model name"
help        = "The name from your provider's documentation."
placeholder = "gpt-4o-mini"

[[settings]]
key         = "api_key"
kind        = "text"
label       = "API key"
help        = "Sent only to the address above. Local models (Ollama / LM Studio) usually need no key — any value will do."
placeholder = "sk-…"
# ⚠️ 遮屏**只管显示**：这份设置文件是明文的（`docs/12` §插件设置为什么不加密）。
# 它挡的是"旁边的人从肩膀上看见"，不是"能读你文件的人"。
secret      = true

[[settings]]
key     = "scope_chars"
kind    = "range"
label   = "Characters the AI may read"
help    = "How many characters the readable files may take together. Roughly a quarter of that many tokens for Chinese text."
min     = 2000
max     = 100000
default = 20000
step    = 1000

[[settings]]
key        = "stream"
kind       = "toggle"
label      = "Show answers as they are written"
help       = "Off means the answer appears all at once. Turn it off if your service does not support streaming."
default_on = true
