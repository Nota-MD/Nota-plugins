name = "中英文间距"
description = "在中文或日文与英文字母、数字之间添加空格，同时保持代码、公式、链接地址、HTML 与 front matter 不变。"

"There is no document to adjust." = "当前没有可调整的文档。"
"The CJK spacing already matches the configured values." = "中英文间距已经符合当前设置。"
"Could not update the document: %s" = "无法更新文档：%s"
"Adjusted %d CJK-Latin boundaries." = "已调整 %d 处中英文边界。"
"Add spaces between CJK and Latin" = "在中英文之间加空格"
"Spaces from CJK to Latin" = "中文/日文到英文的空格数"
"0 removes existing spacing; values above 0 normalize the gap to exactly this many ordinary spaces." = "设为 0 会移除空格；大于 0 时会把间距统一为指定数量的普通空格。"
"Spaces from Latin to CJK" = "英文到中文/日文的空格数"
"Include Japanese kana" = "处理日文假名"
"When off, only Chinese ideographs participate in CJK spacing." = "关闭后只处理汉字与英文之间的间距。"
"Include digits and percent signs" = "处理数字和百分号"
"When off, only Latin letters participate; numbers and percentages stay unchanged." = "关闭后只处理英文字母；数字与百分号保持原样。"

